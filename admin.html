<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuzRider Admin</title>
<style>
:root{--navy:#102D35;--teal:#16A394;--orange:#F4A340;--bg:#f2f8f8;--card:#fff;--txt:#0b2229;--mut:#5b7076;--bd:#c9d8da}
@media(prefers-color-scheme:dark){:root{--bg:#0b1a1f;--card:#12272e;--txt:#e8f1f2;--mut:#9db2b6;--bd:#2a434a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{margin-right:auto}header b span{color:var(--orange)}
header button{width:auto;padding:8px 14px;margin:0;background:#1d4752}header button.on{background:var(--orange);color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
input,select,textarea,button{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);margin:5px 0;background:var(--card);color:var(--txt)}
button{background:var(--teal);color:#fff;border:0;font-weight:700}button.bad{background:#b3261e}button.ghost{background:none;color:var(--teal);border:1px solid var(--teal)}
button.s{width:auto;padding:8px 14px;margin:4px 6px 4px 0}
.err{background:#fde8e6;color:#b3261e;padding:10px;border-radius:10px;margin:8px 0;word-break:break-word}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#fff1d6;color:#7a4b00}
.pill.approved,.pill.resolved{background:#d7f3ee;color:#0b6b5f}.pill.rejected,.pill.suspended,.pill.critical{background:#fde8e6;color:#b3261e}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:14px}.link{cursor:pointer}
</style></head><body>
<header><b>Buz<span>Rider</span> Admin</b><span id="nav"></span></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://yxwcdmzpeqznuoxmvqmy.supabase.co','sb_publishable_qdkQRsmJeWtbmeV9xK_4zw_MkhfH0n9');
const app=document.getElementById('app'),nav=document.getElementById('nav'),$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const E=m=>'<div class="err">'+esc(m)+'</div>';
function login(m){nav.innerHTML='';
 app.innerHTML='<div class="card"><h2>Admin sign in</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button id="go">Sign in</button><button class="ghost" id="gg">Continue with Google</button><div id="err">'+(m?E(m):'')+'</div></div>';
 $('gg').onclick=async()=>{const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)$('err').innerHTML=E(r.error.message)};
 $('go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});
  if(r.error)$('err').innerHTML=E(r.error.message);else start()}}
async function start(){
 const s=await sb.auth.getSession();if(!s.data.session)return login();
 const r=await sb.rpc('is_admin');
 if(r.data!==true){app.innerHTML='<div class="card"><h3>This account is not an admin</h3>'+(r.error?E(r.error.message):'')+'<button id="so">Sign out</button></div>';$('so').onclick=out;return}
 menu('drivers')}
const out=()=>sb.auth.signOut().then(()=>login());
function menu(t){
 nav.innerHTML=[['drivers','Drivers'],['deliveries','Deliveries'],['support','Support'],['settings','Settings']].map((x,i)=>'<button class="'+(t===x[0]?'on':'')+'" id="m'+i+'">'+x[1]+'</button>').join(' ')+' <button id="mo">Sign out</button>';
 [['drivers',drivers],['deliveries',()=>deliveries()],['support',support],['settings',settings]].forEach((x,i)=>$('m'+i).onclick=()=>menu(x[0]));
 $('mo').onclick=out;
 ({drivers:()=>drivers(),deliveries:()=>deliveries(),support:()=>support(),settings:()=>settings()})[t]()}
async function drivers(filter){
 app.innerHTML='<div class="card">Loading…</div>';
 const [p,u]=await Promise.all([sb.from('driver_profiles').select('id,verification_status,is_online'),sb.from('users').select('id,full_name,email,phone')]);
 const err=[p.error,u.error].filter(Boolean).map(x=>E(x.message)).join('');
 const um={};(u.data||[]).forEach(x=>um[x.id]=x);
 const rows=(p.data||[]).filter(x=>!filter||x.verification_status===filter);
 app.innerHTML='<select id="f"><option value="">All statuses</option>'+['pending','approved','rejected','suspended'].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'+err+
 (rows.length?rows.map(x=>{const y=um[x.id]||{};return '<div class="card link" data-id="'+x.id+'"><div class="row"><b>'+esc(y.full_name||'No name')+'</b><span class="pill '+x.verification_status+'">'+x.verification_status+'</span></div><div class="mut">'+esc(y.email||'')+' '+esc(y.phone||'')+(x.is_online?' · online':'')+'</div></div>'}).join(''):'<p class="mut">No drivers found.</p>');
 $('f').onchange=e=>drivers(e.target.value);
 app.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>detail(c.dataset.id))}
async function detail(id){
 app.innerHTML='<div class="card">Loading…</div>';
 const [p,u,v,d]=await Promise.all([sb.from('driver_profiles').select('*').eq('id',id).maybeSingle(),sb.from('users').select('*').eq('id',id).maybeSingle(),sb.from('vehicles').select('*').eq('driver_id',id),sb.from('driver_documents').select('*').eq('driver_id',id)]);
 const docs=await Promise.all((d.data||[]).map(async x=>{const s=await sb.storage.from('driver-documents').createSignedUrl(x.file_path,300);return {...x,url:s.data&&s.data.signedUrl,uerr:s.error&&s.error.message}}));
 const pr=p.data||{},us=u.data||{},st=pr.verification_status;
 app.innerHTML='<button class="ghost s" id="bk">‹ Back</button><div class="card"><div class="row"><h3 style="margin:0">'+esc(us.full_name||'No name')+'</h3><span class="pill '+st+'">'+st+'</span></div><div class="mut">'+esc(us.email||'')+' '+esc(us.phone||'')+'</div><div id="err"></div>'+
 ['approved','rejected','suspended'].filter(s=>s!==st).map(s=>'<button class="s '+(s==='approved'?'':'bad')+'" data-s="'+s+'">'+(s==='approved'?(st==='suspended'||st==='rejected'?'Reinstate':'Approve'):s==='rejected'?'Reject':'Suspend')+'</button>').join('')+'</div>'+
 '<div class="card"><b>Vehicles</b>'+((v.data||[]).map(x=>'<p>'+esc(x.type)+' · '+esc(x.registration_number)+' · '+esc(x.capacity_kg)+' kg</p>').join('')||'<p class="mut">None.</p>')+'</div>'+
 '<div class="card"><b>Documents</b>'+(docs.map(x=>'<div style="margin:12px 0"><div class="row"><span>'+esc(x.document_type)+'</span><span class="pill '+x.verification_status+'">'+x.verification_status+'</span></div>'+
 (x.url?'<a href="'+x.url+'" target="_blank" rel="noreferrer">Open document</a>':E(x.uerr||'No link'))+(x.rejection_reason?'<div class="mut">Reason: '+esc(x.rejection_reason)+'</div>':'')+
 '<div><button class="s" data-da="'+x.id+'">Approve</button><button class="s bad" data-dr="'+x.id+'">Reject</button></div></div>').join('')||'<p class="mut">No documents yet.</p>')+'</div>';
 $('bk').onclick=()=>drivers();
 const show=m=>{$('err').innerHTML=E(m)};
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const s=b.dataset.s;if((s!=='approved')&&!confirm('Change status to '+s+'?'))return;
  const r=await sb.from('driver_profiles').update({verification_status:s}).eq('id',id).select('id');
  if(r.error)return show(r.error.message);if(!r.data.length)return show('No rows updated (security rule).');detail(id)});
 app.querySelectorAll('[data-da]').forEach(b=>b.onclick=async()=>{const r=await sb.from('driver_documents').update({verification_status:'approved',rejection_reason:null}).eq('id',b.dataset.da).select('id');
  if(r.error)return show(r.error.message);detail(id)});
 app.querySelectorAll('[data-dr]').forEach(b=>b.onclick=async()=>{const why=prompt('Reason for rejection (required)');if(!why||!why.trim())return;
  const r=await sb.from('driver_documents').update({verification_status:'rejected',rejection_reason:why.trim()}).eq('id',b.dataset.dr).select('id');
  if(r.error)return show(r.error.message);detail(id)});
 extra(id)}
async function support(){
 app.innerHTML='<div class="card">Loading…</div>';
 const [t,u]=await Promise.all([sb.from('support_tickets').select('*').order('created_at',{ascending:false}),sb.from('users').select('id,full_name,email')]);
 const um={};(u.data||[]).forEach(x=>um[x.id]=x);
 const sel=(id,opts,cur)=>'<select id="'+id+'">'+opts.map(o=>'<option value="'+o[0]+'" '+(cur===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
 app.innerHTML=(t.error?E(t.error.message):'')+((t.data||[]).map(x=>{const y=um[x.driver_id]||{};
  return '<div class="card"><div class="row"><b>'+esc(x.type)+' · '+esc(y.full_name||y.email||'driver')+'</b><span class="pill '+esc(x.severity)+'">'+esc(x.severity)+'</span></div><p>'+esc(x.message)+'</p>'+
  '<label class="mut">Severity</label>'+sel('sv'+x.id,[['minor','Minor'],['serious','Serious'],['critical','Critical (suspends driver)']],x.severity)+
  '<label class="mut">Decision</label>'+sel('dc'+x.id,[['','No decision'],['dismissed','Dismissed'],['warning','Warning'],['suspended','Suspend driver']],x.decision||'')+
  '<textarea id="nt'+x.id+'" placeholder="Note">'+esc(x.decision_note||'')+'</textarea>'+
  '<label class="mut">Status</label>'+sel('ss'+x.id,[['open','Open'],['in_progress','In progress'],['resolved','Resolved']],x.status)+
  '<button data-t="'+x.id+'">Save</button><div id="e'+x.id+'"></div></div>'}).join('')||'<p class="mut">No tickets.</p>');
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const id=b.dataset.t,dc=$('dc'+id).value,sv=$('sv'+id).value;
  if((dc==='suspended'||sv==='critical')&&!confirm('This suspends the driver. Continue?'))return;
  const r=await sb.from('support_tickets').update({severity:sv,decision:dc||null,decision_note:$('nt'+id).value||null,status:$('ss'+id).value}).eq('id',id).select('id');
  $('e'+id).innerHTML=r.error?E(r.error.message):r.data.length?'<p class="mut">Saved.</p>':E('No rows updated (security rule).')})}

const Rr=x=>'R'+Number(x||0).toFixed(2),Dt=x=>x?new Date(x).toLocaleString():'';
async function extra(id){
 const dl=await sb.from('deliveries').select('id').eq('driver_id',id);const ids=(dl.data||[]).map(x=>x.id);
 const py=ids.length?await sb.from('payments').select('*').in('delivery_id',ids):{data:[]};
 const owed=(py.data||[]).filter(x=>x.method==='cash'&&x.cash_confirmed_by_driver&&!x.cash_settled_at);
 const tot=owed.reduce((t,x)=>t+Number(x.cash_owed_to_platform||0),0);
 app.insertAdjacentHTML('beforeend','<div class="card"><b>Cash</b><p>Owed to BuzRider: <b>'+Rr(tot)+'</b> ('+owed.length+' deliveries)</p>'+(tot>0?'<button id="settle">Mark cash as received</button>':'')+
  '<b>Message this driver</b><input id="nt" placeholder="Title"><textarea id="nb" rows="3" placeholder="Message"></textarea><button id="sn">Send message</button><div id="exe"></div></div>');
 const e=m=>{$('exe').innerHTML=E(m)};
 if($('settle'))$('settle').onclick=async()=>{if(!confirm('Mark '+Rr(tot)+' as received from this driver?'))return;
  const r=await sb.from('payments').update({cash_settled_at:new Date().toISOString()}).in('id',owed.map(x=>x.id)).select('id');if(r.error)return e(r.error.message);detail(id)};
 $('sn').onclick=async()=>{const t=$('nt').value.trim();if(!t)return e('Enter a title.');
  const r=await sb.from('notifications').insert({user_id:id,title:t,body:$('nb').value.trim()||null});if(r.error)return e(r.error.message);$('exe').innerHTML='<p class="mut">Sent.</p>';$('nt').value='';$('nb').value=''}}
async function deliveries(f){
 app.innerHTML='<div class="card">Loading…</div>';
 const [dl,rq,u]=await Promise.all([sb.from('deliveries').select('id,request_id,driver_id,vehicle_id,status,commission_percentage,driver_earnings,platform_commission,assigned_at,picked_up_at,delivered_at,cancelled_reason,created_at,updated_at,otp_attempts').order('created_at',{ascending:false}).limit(100),sb.from('delivery_requests').select('id,customer_name,pickup_address,destination_address,price,payment_method'),sb.from('users').select('id,full_name,email')]);
 const err=[dl.error,rq.error,u.error].filter(Boolean).map(x=>E(x.message)).join('');
 const R_={},U_={};(rq.data||[]).forEach(x=>R_[x.id]=x);(u.data||[]).forEach(x=>U_[x.id]=x);
 const rows=(dl.data||[]).filter(x=>!f||x.status===f);
 app.innerHTML='<select id="f"><option value="">All statuses</option>'+['searching','driver_assigned','driver_arriving','picked_up','in_transit','delivered','cancelled','disputed'].map(s=>'<option value="'+s+'" '+(f===s?'selected':'')+'>'+s.replace(/_/g,' ')+'</option>').join('')+'</select>'+err+
 (rows.length?rows.map(x=>{const r=R_[x.request_id]||{},d=U_[x.driver_id]||{};return '<div class="card link" data-id="'+x.id+'"><div class="row"><b>'+esc(r.pickup_address||'')+' → '+esc(r.destination_address||'')+'</b><span class="pill '+(x.status==='delivered'?'approved':x.status==='cancelled'||x.status==='disputed'?'rejected':'')+'">'+x.status.replace(/_/g,' ')+'</span></div><div class="mut">'+Dt(x.created_at)+' · '+esc(d.full_name||d.email||'No driver yet')+' · '+Rr(r.price)+' '+esc(r.payment_method||'')+'</div></div>'}).join(''):'<p class="mut">No deliveries yet.</p>');
 $('f').onchange=e=>deliveries(e.target.value);
 app.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>dDetail(c.dataset.id))}
async function dDetail(id){
 app.innerHTML='<div class="card">Loading…</div>';
 const [d,h,m,p]=await Promise.all([sb.from('deliveries').select('id,request_id,driver_id,vehicle_id,status,commission_percentage,driver_earnings,platform_commission,assigned_at,picked_up_at,delivered_at,cancelled_reason,created_at,updated_at,otp_attempts').eq('id',id).maybeSingle(),sb.from('delivery_status_history').select('*').eq('delivery_id',id).order('created_at'),sb.from('messages').select('*').eq('delivery_id',id).order('created_at'),sb.from('payments').select('*').eq('delivery_id',id)]);
 const x=d.data||{};
 const [r,u]=await Promise.all([sb.from('delivery_requests').select('*').eq('id',x.request_id).maybeSingle(),x.driver_id?sb.from('users').select('full_name,email,phone').eq('id',x.driver_id).maybeSingle():{data:null}]);
 const q=r.data||{},dr=u.data||{},lab={driver:'Driver',customer:'Customer',system:'BuzRider support'},pay=(p.data||[])[0];
 const err=[d.error,h.error,m.error,p.error,r.error].filter(Boolean).map(z=>E(z.message)).join('');
 app.innerHTML='<button class="ghost s" id="bk">‹ Back</button>'+err+
 '<div class="card"><div class="row"><b>'+esc(x.status||'').replace(/_/g,' ')+'</b><span class="mut">'+Dt(x.created_at)+'</span></div><p>'+esc(q.pickup_address)+' → '+esc(q.destination_address)+'</p><p class="mut">'+esc(q.item_description||'')+' · '+esc(q.vehicle_type||'')+' · '+esc(q.distance_km||'?')+' km</p>'+
 '<p>Customer: '+esc(q.customer_name||'')+' '+esc(q.customer_phone||'')+'</p><p>Driver: '+esc(dr.full_name||dr.email||'not assigned')+' '+esc(dr.phone||'')+'</p>'+
 '<p>Price '+Rr(q.price)+' · '+esc(q.payment_method||'')+(x.driver_earnings!=null?' · driver '+Rr(x.driver_earnings)+' · commission '+Rr(x.platform_commission)+' ('+esc(x.commission_percentage)+'%)':'')+'</p>'+
 (pay?'<p class="mut">Payment: '+esc(pay.status)+(pay.method==='cash'?' · cash confirmed by driver: '+(pay.cash_confirmed_by_driver?'yes':'no')+' · owed '+Rr(pay.cash_owed_to_platform)+(pay.cash_settled_at?' (settled)':''):'')+'</p>':'')+
 (x.cancelled_reason?'<p class="mut">Cancelled: '+esc(x.cancelled_reason)+'</p>':'')+'</div>'+
 '<div class="card"><b>Timeline</b>'+((h.data||[]).map(y=>'<div class="row" style="margin:6px 0"><span>'+esc(y.status).replace(/_/g,' ')+'</span><span class="mut">'+Dt(y.created_at)+'</span></div>').join('')||'<p class="mut">No history.</p>')+'</div>'+
 '<div class="card"><b>Messages</b>'+((m.data||[]).map(y=>'<div style="margin:8px 0"><span class="mut">'+(lab[y.sender_type]||y.sender_type)+' · '+Dt(y.created_at)+'</span><div>'+esc(y.body)+'</div></div>').join('')||'<p class="mut">No messages.</p>')+
 '<input id="mb" maxlength="1000" placeholder="Write as BuzRider support"><button id="ms">Send</button><div id="me"></div></div>';
 $('bk').onclick=()=>deliveries();
 $('ms').onclick=async()=>{const b=$('mb').value.trim();if(!b)return;const me=(await sb.auth.getUser()).data.user;
  const w=await sb.from('messages').insert({delivery_id:id,sender_type:'system',sender_id:me.id,body:b});if(w.error)return $('me').innerHTML=E(w.error.message);dDetail(id)}}
async function settings(){
 app.innerHTML='<div class="card">Loading…</div>';
 const c=await sb.from('commissions').select('*').order('effective_from',{ascending:false}).limit(10);
 const cur=(c.data||[]).find(x=>new Date(x.effective_from)<=new Date());
 app.innerHTML=(c.error?E(c.error.message):'')+'<div class="card"><b>Commission</b><p>Current: <b>'+(cur?esc(cur.percentage)+'%':'not set')+'</b>. A new value applies to new deliveries only.</p><input id="cp" type="number" min="0" max="100" step="0.5" placeholder="New percentage, e.g. 15"><button id="cs">Save commission</button><div id="ce"></div></div>'+
 '<div class="card"><b>History</b>'+((c.data||[]).map(x=>'<div class="row" style="margin:6px 0"><span>'+esc(x.percentage)+'%</span><span class="mut">'+Dt(x.effective_from)+'</span></div>').join('')||'<p class="mut">None.</p>')+'</div>';
 app.insertAdjacentHTML('beforeend','<div class="card"><b>Change my password</b><input id="pw" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"><button id="pb">Change password</button><div id="pe"></div></div>');
 $('pb').onclick=async()=>{const v=$('pw').value;if(v.length<8)return $('pe').innerHTML=E('Use at least 8 characters.');
  const r=await sb.auth.updateUser({password:v});$('pe').innerHTML=r.error?E(r.error.message):'<p class="mut">Password changed.</p>';if(!r.error)$('pw').value=''};
 $('cs').onclick=async()=>{const v=Number($('cp').value);if($('cp').value===''||!(v>=0&&v<=100))return $('ce').innerHTML=E('Enter a number from 0 to 100.');
  if(!confirm('Set commission to '+v+'% for new deliveries?'))return;const me=(await sb.auth.getUser()).data.user;
  const w=await sb.from('commissions').insert({percentage:v,effective_from:new Date().toISOString(),created_by:me.id});if(w.error)return $('ce').innerHTML=E(w.error.message);settings()}}
sb.auth.getSession().then(r=>r.data.session?start():login());
</script></body></html>
